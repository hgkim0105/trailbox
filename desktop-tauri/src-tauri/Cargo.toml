[package]
name = "trailbox-desktop"
version = "0.0.0"
description = "Tauri shell for the Trailbox QA-recording desktop client."
authors = ["Trailbox"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trailbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Default: no custom protocol. Add features as we wire IPC commands.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
