<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Geist', system-ui, sans-serif; overflow: hidden; }
  .overlay {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 8px;
    background: oklch(0.1 0.01 270 / 0.82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px oklch(0 0 0 / 0.4);
    color: white; user-select: none;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: oklch(0.6 0.22 25);
    box-shadow: 0 0 6px 2px oklch(0.6 0.22 25 / 0.5);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .time {
    font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    font-size: 11px; color: oklch(1 0 0 / 0.5);
    padding-left: 10px; border-left: 1px solid oklch(1 0 0 / 0.15);
  }
  kbd {
    padding: 1px 4px; border: 1px solid oklch(1 0 0 / 0.2);
    border-radius: 3px; font-family: 'Geist Mono', monospace; font-size: 10px;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet">
</head>
<body>
<div class="overlay">
  <span class="dot"></span>
  <span class="time" id="time">00:00</span>
  <span class="hint"><kbd>Ctrl+Alt+R</kbd> 정지</span>
</div>
<script>
  const el = document.getElementById('time');
  let sec = 0;
  function render() {
    const m = Math.floor(sec / 60), s = sec % 60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  setInterval(() => { sec++; render(); }, 1000);
  window.setElapsed = function(v) { sec = v; render(); };
</script>
</body>
</html>
