{% extends "base.html" %}
{% block title %}비밀번호 변경 · Trailbox Hub{% endblock %}
{% block content %}
<section class="card">
  <h1>비밀번호 변경</h1>

  {% if forced %}
    <p class="error">
      관리자가 비밀번호를 재설정했습니다. 계속 사용하려면 새 비밀번호를 설정해야 합니다.
    </p>
  {% endif %}

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form action="/account/password" method="post" class="stack">
    <label>현재 비밀번호
      <input name="current_password" type="password" required autofocus />
    </label>
    <label>새 비밀번호 <span class="muted">(최소 8자, username 포함 금지)</span>
      <input name="new_password" type="password" required minlength="8" />
    </label>
    <label>새 비밀번호 (확인)
      <input name="new_password2" type="password" required minlength="8" />
    </label>
    <button type="submit" class="primary">변경</button>
  </form>
</section>
{% endblock %}
