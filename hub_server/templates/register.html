{% extends "base.html" %}
{% block title %}회원가입 · Trailbox Hub{% endblock %}
{% block content %}
<section class="card">
  <h1>회원가입</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if pending %}
    <p class="success">가입 신청을 접수했습니다. 관리자 승인 후 로그인할 수 있습니다.</p>
    <p><a href="/login">로그인 페이지로</a></p>
  {% else %}
    <form action="/register" method="post" class="stack">
      <label>Username
        <input name="username" required autofocus />
      </label>
      <label>Email <span class="muted">(선택)</span>
        <input name="email" type="email" />
      </label>
      <label>Password <span class="muted">(최소 8자)</span>
        <input name="password" type="password" required minlength="8" />
      </label>
      <button type="submit" class="primary">신청</button>
    </form>
    <p class="muted">이미 계정이 있나요? <a href="/login">로그인</a></p>
  {% endif %}
</section>
{% endblock %}
