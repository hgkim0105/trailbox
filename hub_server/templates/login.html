{% extends "base.html" %}
{% block title %}로그인 · Trailbox Hub{% endblock %}

{% block body %}
<div class="auth-shell">
  <div class="auth-shell__form">
    <a class="auth-shell__brand" href="/">
      <div class="sidebar__brand-mark" style="width:24px;height:24px"></div>
      <span>Trailbox <span style="color:var(--muted);font-weight:500">Hub</span></span>
    </a>

    <div class="auth-shell__form-inner">
      <h1>다시 만나서 반가워요</h1>
      <p class="subtitle">Trailbox Hub에 로그인하고 팀이 캡처한 세션을 확인하세요.</p>

      {% if error %}
        <div class="flash flash--error">{{ error }}</div>
      {% endif %}

      <form action="/login" method="post">
        {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
        <div class="field">
          <label class="field__label" for="login-username">Username</label>
          <input class="input input--lg" id="login-username" name="username"
                 required autofocus value="{{ username or '' }}"
                 autocomplete="username" placeholder="username" />
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <input class="input input--lg" id="login-password" name="password"
                 type="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn--primary btn--lg" type="submit">로그인</button>
      </form>

      <div class="auth-foot">
        계정이 없나요? <a href="/register">회원가입</a>
      </div>
    </div>
  </div>

  {% include "_auth_visual.html" %}
</div>

<button class="btn btn--ghost btn--icon btn--sm" data-action="toggle-theme"
        title="테마 전환" aria-label="테마 전환"
        style="position:fixed;top:20px;right:20px;z-index:100;background:var(--surface);border:1px solid var(--border)">
  <svg data-theme-icon viewBox="0 0 16 16" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
       width="16" height="16" aria-hidden="true"></svg>
</button>
{% endblock %}
